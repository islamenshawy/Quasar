spring:
  application:
    name: cms-core
  datasource:
    url: jdbc:postgresql://localhost:5432/cms
    username: cms
    password: ${CMS_DB_PASSWORD}
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 30m              # console sign-in session
      cookie:
        http-only: true
        same-site: lax

cms:
  hsm:
    host: 10.0.0.50          # payShield 10K host port IP (test)
    port: 1500
    header-length: 4          # must match payShield host settings
    pool-size: 4
    connect-timeout-ms: 3000
    read-timeout-ms: 2000
    borrow-timeout-ms: 1000
  security:
    # TEST ONLY. Base64 256-bit keys. In production these come from a KMS/HSM, never from config.
    pan-enc-key: ${CMS_PAN_ENC_KEY}
    pan-hmac-key: ${CMS_PAN_HMAC_KEY}
    pan-key-check: ${CMS_PAN_KEY_CHECK:FAIL}     # FAIL: refuse to start when the keys match none of the newest live cards; WARN: log only
  keys:
    kiosk-zpk-name: ZPK_KIOSK     # ZPK under which the kiosk EPP sends PIN blocks
    corehost-zpk-name: ZPK_COREHOST
    corehost-zmk-name: ZMK_COREHOST   # protects ZPKs received in 1804 key change
    channel-zpk-name: ZPK_CHANNEL     # PIN blocks set from the cardholder app (CMS-115, provisional IN-08)
  dexxis:
    api-key: ${CMS_DEXXIS_API_KEY:}   # X-Api-Key Dexxis must send; empty = Dexxis calls refused
  channel:
    api-key: ${CMS_CHANNEL_API_KEY:}  # X-Api-Key for /api/channel (ACS, mobile, IVR); empty = refused
  notify:                             # customer SMS / e-mail (CMS-105); gateways provisional (IN-07)
    poll-ms: 5000
    sms:
      provider: ${CMS_SMS_PROVIDER:HTTP}           # HTTP or LOG (nothing sent)
      url: ${CMS_SMS_URL:}
      api-key: ${CMS_SMS_API_KEY:}
      sender: ${CMS_SMS_SENDER:BANK}
    email:
      provider: ${CMS_EMAIL_PROVIDER:HTTP}
      url: ${CMS_EMAIL_URL:}
      api-key: ${CMS_EMAIL_API_KEY:}
      sender: ${CMS_EMAIL_SENDER:no-reply@bank.local}
  otp:
    ttl-seconds: 300
    max-attempts: 3
    max-per-window: 3                 # codes per card per 10 minutes
  tsp:                                # token service provider (CMS-115, provisional IN-08)
    base-url: ${CMS_TSP_URL:}                   # issuer -> TSP lifecycle; empty = messages wait in the outbox
    api-key: ${CMS_TSP_API_KEY:}                # sent to the TSP
    inbound-api-key: ${CMS_TSP_INBOUND_API_KEY:}  # X-Api-Key the TSP must send to /api/tsp; empty = refused
    timeout-ms: 5000
    poll-ms: 5000
  core-banking:                       # funds interface for CORE_BANKING accounts (CMS-090, provisional IN-06)
    base-url: ${CMS_CORE_BANKING_URL:}          # empty = not connected: core accounts decline (stand-in limit aside)
    api-key: ${CMS_CORE_BANKING_API_KEY:}
    timeout-ms: ${CMS_CORE_BANKING_TIMEOUT_MS:3000}
  admin:
    initial-password: ${CMS_ADMIN_PASSWORD:}   # first start only; generated and logged when empty
  iso:
    # BASE24 ISO 8583:1993 interface for the ATM / POS switch (CMS-051..054). Layout is provisional (IN-01).
    enabled: true
    port: 7000
    length-prefix: BINARY2        # BINARY2 (2-byte length) or ASCII4
    header-length: 0              # static BASE24 header in front of the MTI, echoed back; 0 = none
    packager: iso/base24-1993.xml
  issuance:
    pin-block-format: ISO_0
